# Target allocation. The real file lives at
# ~/.config/investment-tools/allocation.toml and describes real holdings, so it
# is never committed. The numbers below are invented.
#
# share_pct values must add up to 100. Tolerance bands are derived, not
# configured: a position is flagged once it moves either 5 percentage points or
# a quarter of its own target away from where it belongs, whichever comes first.

[[position]]
wkn = "AAA111"
name = "Example World ETF"
share_pct = 60.0

[[position]]
wkn = "BBB222"
name = "Example Emerging Markets ETF"
share_pct = 25.0

[[position]]
wkn = "CCC333"
name = "Example Short-Term Government Bond ETF"
share_pct = 15.0
